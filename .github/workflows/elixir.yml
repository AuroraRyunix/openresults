# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    # Actions are pinned to a commit, not to a tag. A tag is mutable, and
    # whoever can move it runs their code in this workflow with this
    # repository checked out. The trailing comment is the human-readable
    # version.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.20' # [Required] Define the Elixir version
        otp-version: '29.0'    # [Required] Define the Erlang/OTP version

    - name: Restore dependencies and build cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      # --check-locked: a mix.exs constraint edited without a matching
      # mix.lock update re-resolves silently, and CI would then be testing a
      # dependency tree that exists nowhere else. This fails instead.
      run: mix deps.get --check-locked

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Check formatting
      run: mix format --check-formatted

    - name: Run tests
      run: mix test
